services:
  es-master01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: es-master01
    environment:
      - node.name=es-master01
      - cluster.name=learning-cluster
      - node.roles=master
      - discovery.seed_hosts=es-master01,es-master02,es-master03,es-data01
      - cluster.initial_master_nodes=es-master01,es-master02,es-master03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_master01_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  es-master02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: es-master02
    environment:
      - node.name=es-master02
      - cluster.name=learning-cluster
      - node.roles=master
      - discovery.seed_hosts=es-master01,es-master02,es-master03,es-data01
      - cluster.initial_master_nodes=es-master01,es-master02,es-master03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_master02_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"

  es-master03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: es-master03
    environment:
      - node.name=es-master03
      - cluster.name=learning-cluster
      - node.roles=master
      - discovery.seed_hosts=es-master01,es-master02,es-master03,es-data01
      - cluster.initial_master_nodes=es-master01,es-master02,es-master03
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_master03_data:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"

  es-data01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: es-data01
    environment:
      - node.name=es-data01
      - cluster.name=learning-cluster
      - node.roles=data,ingest,remote_cluster_client
      - discovery.seed_hosts=es-master01,es-master02,es-master03,es-data01
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data01_data:/usr/share/elasticsearch/data
    ports:
      - "9203:9200"
    depends_on:
      - es-master01
      - es-master02
      - es-master03

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.20
    container_name: kibana
    depends_on:
      - es-data01
    environment:
      - ELASTICSEARCH_HOSTS=http://es-data01:9200
    ports:
      - "5601:5601"

  cerebro:
    image: lmenezes/cerebro:0.9.4
    container_name: cerebro
    depends_on:
      - es-data01
    ports:
      - "9000:9000"

volumes:
  es_master01_data:
  es_master02_data:
  es_master03_data:
  es_data01_data:
